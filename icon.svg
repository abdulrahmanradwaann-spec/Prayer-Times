<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Background Shape -->
    <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />
    
    <!-- Subtle Geometric Pattern -->
    <g opacity="0.1">
        <circle cx="256" cy="256" r="200" fill="none" stroke="#3b82f6" stroke-width="1" />
        <circle cx="256" cy="256" r="150" fill="none" stroke="#3b82f6" stroke-width="1" />
        <line x1="256" y1="56" x2="256" y2="456" stroke="#3b82f6" stroke-width="1" />
        <line x1="56" y1="256" x2="456" y2="256" stroke="#3b82f6" stroke-width="1" />
    </g>

    <!-- Mosque Dome -->
    <path d="M256 120 C180 120 120 200 120 300 L392 300 C392 200 332 120 256 120 Z" fill="url(#accent-grad)" filter="url(#glow)" />
    
    <!-- Crescent Moon -->
    <path d="M256 60 C275 60 290 75 290 95 C290 115 275 130 256 130 C270 130 280 118 280 105 C280 92 270 80 256 80 Z" fill="#f8fafc" />
    
    <!-- Minarets -->
    <rect x="90" y="240" width="20" height="100" rx="5" fill="url(#accent-grad)" />
    <rect x="402" y="240" width="20" height="100" rx="5" fill="url(#accent-grad)" />
    
    <!-- Base / Compass Needle -->
    <path d="M120 320 L392 320 L392 340 L256 380 L120 340 Z" fill="url(#accent-grad)" opacity="0.8" />
    
    <!-- Center Point -->
    <circle cx="256" cy="310" r="8" fill="#f8fafc" />
</svg>